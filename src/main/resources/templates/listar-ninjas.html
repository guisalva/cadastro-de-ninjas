<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tabela de Ninjas</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            padding: 40px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 30px;
            color: #222;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
            font-size: 15px;
        }

        .table-container {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        thead {
            background-color: #222;
            color: #fff;
        }

        th {
            padding: 16px 18px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        td {
            padding: 15px 18px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            vertical-align: middle;
        }

        tbody tr {
            transition: background-color 0.2s ease;
        }

        tbody tr:hover {
            background-color: #f8f9fa;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .ninja-image {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #eee;
        }

        .ninja-name {
            font-weight: 600;
            color: #222;
        }

        .ninja-id {
            color: #888;
            font-weight: 500;
        }

        .rank {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background-color: #eef2f5;
            color: #444;
            font-size: 12px;
            font-weight: 600;
        }

        .mission {
            max-width: 300px;
            line-height: 1.5;
            color: #555;
        }

        .no-mission {
            color: #999;
            font-style: italic;
        }

        .actions {
            display: flex;
            gap: 8px;
            white-space: nowrap;
        }

        .actions a {
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-create {
            background-color: #ecfdf5;
            color: #16a34a;

            text-decoration: none;
            padding: 16px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-create:hover {
            background-color: #dcfce7;
            color: #15803d;
        }

        .btn-details {
            background-color: #f0f2f4;
            color: #333;
        }

        .btn-details:hover {
            background-color: #dfe3e6;
        }

        .btn-edit {
            background-color: #e8f0fe;
            color: #2563eb;
        }

        .btn-edit:hover {
            background-color: #d5e4fd;
        }

        .btn-delete {
            background-color: #feecec;
            color: #dc2626;
        }

        .btn-delete:hover {
            background-color: #fbd5d5;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .table-container {
                border-radius: 8px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <div>
            <h1>Lista de Ninjas</h1>
            <p>Visualize as informações dos ninjas cadastrados.</p>
        </div>

        <a th:href="@{/ninjas/ui/criar}" class="btn-create">
            Adicionar Ninja
        </a>
    </div>

    <div class="table-container">

        <table>

            <thead>
            <tr>
                <th>Imagem</th>
                <th>Id</th>
                <th>Nome</th>
                <th>Idade</th>
                <th>Email</th>
                <th>Rank</th>
                <th>Missão</th>
                <th>Ações</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="ninja : ${ninjas}">
                <td>
                    <img
                            class="ninja-image"
                            th:src="${ninja.imgUrl}"
                            th:alt="${ninja.nome}"
                    />
                </td>
                <td>
                    <span class="ninja-id" th:text="${ninja.id}"></span>
                </td>
                <td>
                    <span class="ninja-name" th:text="${ninja.nome}"></span>
                </td>
                <td th:text="${ninja.idade}"></td>
                <td th:text="${ninja.email}"></td>
                <td>
                    <span class="rank" th:text="${ninja.rank}"></span>
                </td>
                <td class="mission">
                    <span th:if="${ninja.missao}">
                        <strong th:text="${ninja.missao.nome}"></strong>
                        <br>
                        <span>
                            Descrição:
                            <span th:text="${ninja.missao.descricao}"></span>
                        </span>
                    </span>
                    <span
                            class="no-mission"
                            th:if="${ninja.missao == null}">
                        Sem missões cadastradas para o ninja
                    </span>
                </td>
                <td>
                    <div class="actions">
                        <a th:href="@{/ninjas/ui/listar/{id}(id=${ninja.id})}" class="btn-details">
                            Ver detalhes
                        </a>
                        <a th:href="@{/ninjas/ui/deletar/{id}(id=${ninja.id})}" class="btn-edit">
                            Editar
                        </a>
                        <a th:href="@{/ninjas/ui/deletar/{id}(id=${ninja.id})}" class="btn-delete">
                            Excluir
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
